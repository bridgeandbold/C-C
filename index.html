  function build(cfg){
    var wrap=document.createElement("div");
    wrap.style.cssText="max-width:72rem;margin:0 auto;padding:0 1.25rem 3.5rem;";
    var grid=document.createElement("div");
    grid.style.cssText="display:grid;grid-template-columns:1fr;gap:2rem;align-items:center;";
    if(window.matchMedia("(min-width:768px)").matches){grid.style.gridTemplateColumns="1.15fr .85fr";}
    var img=document.createElement("img");
    img.src=cfg.src; img.alt=cfg.alt||""; img.loading="lazy";
    img.style.cssText="display:block;width:100%;height:100%;max-height:26rem;object-fit:cover;border-radius:1.25rem;border:1px solid rgba(255,255,255,.10);box-shadow:0 40px 80px -40px rgba(0,0,0,.9);";
    var txt=document.createElement("div");
    var h=document.createElement("h3"); h.textContent=cfg.title||""; h.style.cssText="font-size:1.6rem;line-height:1.25;color:#f5f1e8;margin:0 0 .75rem;font-weight:600;";
    var p=document.createElement("p"); p.textContent=cfg.text||""; p.style.cssText="font-size:1.02rem;line-height:1.7;color:#c8c1b4;margin:0;";
    txt.appendChild(h); txt.appendChild(p);
    grid.appendChild(img); grid.appendChild(txt);
    wrap.appendChild(grid);
    return wrap;
  }
  function insert(cfg){
    if(!cfg.src||cfg.src.indexOf("__")===0) return true;
    var nodes=[].slice.call(document.querySelectorAll("h1,h2,h3"));
    var node=null;
    for(var i=0;i<nodes.length;i++){ if((nodes[i].textContent||"").toLowerCase().indexOf(cfg.match.toLowerCase())>-1){node=nodes[i];break;} }
    if(!node) return false;
    var sec=node.closest("section")||node.parentElement;
    if(!sec) return false;
    if(sec.getAttribute("data-cc-photo")==="1") return true;
    sec.setAttribute("data-cc-photo","1");
    sec.parentNode.insertBefore(build(cfg), sec.nextSibling);
    return true;
  }
  function run(){var all=true;window.__ccExtraPhotos.forEach(function(x){if(!insert(x))all=false;});return all;}
  var n=0,t=setInterval(function(){if(run()||++n>60)clearInterval(t);},200);
  if(document.readyState!=="loading")run();else document.addEventListener("DOMContentLoaded",run);
})();
</script>
